<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Artist Landing Page</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">

        <div class="container">

            <a class="navbar-brand" href="#">
                Music Artist
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link active" href="#home">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#about">
                            About
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#contact">
                            Contact
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <section id="home" class="container py-5 text-center">

        <img src="/images/arijit.jfif"
             alt="Artist"
             class="rounded-circle img-fluid mb-4"
             width="220">

        <h1 class="fw-bold">
            Arijit Singh
        </h1>

        <p class="lead">
            Welcome to the official music artist landing page.
        </p>

    </section>

    <section id="about" class="container py-5">

        <h2>About</h2>

        <p>
            Arijit Singh is one of India's most popular playback singers,
            known for his soulful voice and timeless music.
        </p>

    </section>

    <section id="contact" class="container py-5">

        <h2>Contact</h2>

        <p>
            Email: artist@example.com
        </p>

    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
