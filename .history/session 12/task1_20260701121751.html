<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Artist Landing Page</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-dark text-light">

    <div class="container py-5">

        <div class="text-center">

            <img src="artist.jpg"
                 alt="Artist"
                 class="rounded-circle img-fluid mb-4"
                 width="220">

            <h1 class="fw-bold">
                Aviah ahir
            </h1>

            <p class="lead mt-3">
                Arijit Singh is one of India's most popular playback singers,
                known for his soulful voice and versatile musical style.
                His songs have won millions of hearts around the world.
            </p>

            <div class="mt-4">

                <a href="#" class="btn btn-primary me-2">
                    <i class="bi bi-facebook"></i>
                    Facebook
                </a>

                <a href="#" class="btn btn-danger me-2">
                    <i class="bi bi-instagram"></i>
                    Instagram
                </a>

                <a href="#" class="btn btn-info text-white">
                    <i class="bi bi-twitter-x"></i>
                    Twitter
                </a>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
