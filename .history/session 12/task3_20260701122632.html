<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Product Showcase</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">

        <h2 class="text-center mb-5">
            Flipkart Product Showcase
        </h2>

        <div class="row g-4">

            <div class="col-6 col-md-3">

                <div class="card h-100 shadow">

                    <img src="/images/360_F_1252445296_zuieI70eVnSjlqRjCkgWQu3c5fxdGZL8.jpg"
                         class="card-img-top"
                         alt="Product 1">

                    <div class="card-body text-center">

                        <h5 class="card-title">
                            Wireless Headphones
                        </h5>

                        <p class="text-primary fw-bold">
                            ₹1,999
                        </p>

                        <button class="btn btn-primary">
                            Buy Now
                        </button>

                    </div>

                </div>

            </div>

            <div class="col-6 col-md-3">

                <div class="card h-100 shadow">

                    <img src="/images/360_F_870401630_az9iKFAJTeulvN10p56qhB5uSMszC2f1.jpg"
                         class="card-img-top"
                         alt="Product 2">

                    <div class="card-body text-center">

                        <h5 class="card-title">
                            t-shirt
                        </h5>

                        <p class="text-primary fw-bold">
                            ₹2,499
                        </p>

                        <button class="btn btn-primary">
                            Buy Now
                        </button>

                    </div>

                </div>

            </div>

            <div class="col-6 col-md-3">

                <div class="card h-100 shadow">

                    <img src="/images/9ad2327a-1a00-4f53-453a-76efe225b2e3.jpg"
                         class="card-img-top"
                         alt="Product 3">

                    <div class="card-body text-center">

                        <h5 class="card-title">
                            shirt
                        </h5>

                        <p class="text-primary fw-bold">
                            ₹1,499
                        </p>

                        <button class="btn btn-primary">
                            Buy Now
                        </button>

                    </div>

                </div>

            </div>

            <div class="col-6 col-md-3">

                <div class="card h-100 shadow">

                    <img src="/images/6a106cb6-2eec-456b-c11d-5975b6f744ff.jpg"
                         class="card-img-top"
                         alt="Product 4">

                    <div class="card-body text-center">

                        <h5 class="card-title">
                            mistery box
                        </h5>

                        <p class="text-primary fw-bold">
                            ₹999
                        </p>

                        <button class="btn btn-primary">
                            Buy Now
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
