<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Grid</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
            background:#f1f3f6;
            padding:20px;
        }

        .grid-container{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:20px;
            max-width:1000px;
            margin:auto;
        }
        .grid-item{
            background:white;
            border:1px solid #ccc;
            border-radius:10px;
            padding:20px;
            text-align:center;
            box-shadow:0 2px 8px rgba(0,0,0,0.2);
        }

        .grid-item img{
            width:120px;
            height:120px;
            object-fit:contain;
            margin-bottom:10px;
        }

        .grid-item h2{
            font-size:20px;
            color:#333;
        }
        @media (max-width:768px){
            .grid-container{
                grid-template-columns:repeat(2,1fr);
            }
        }
        @media (max-width:480px){
            .grid-container{
                grid-template-columns:1fr;
            }
        }

    </style>
</head>

<body>

    <div class="grid-container">

        <div class="grid-item">
            <img src="product1.jpg" alt="Product 1">
            <h2>Headphones</h2>
        </div>

        <div class="grid-item">
            <img src="product2.jpg" alt="Product 2">
            <h2>Smart Watch</h2>
        </div>

        <div class="grid-item">
            <img src="product3.jpg" alt="Product 3">
            <h2>Speaker</h2>
        </div>

        <div class="grid-item">
            <img src="product4.jpg" alt="Product 4">
            <h2>Keyboard</h2>
        </div>

        <div class="grid-item">
            <img src="product5.jpg" alt="Product 5">
            <h2>Mouse</h2>
        </div>

        <div class="grid-item">
            <img src="product6.jpg" alt="Product 6">
            <h2>Power Bank</h2>
        </div>

    </div>

</body>
</html>
