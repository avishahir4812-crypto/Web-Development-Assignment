<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reusable CSS Class</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

.spacing{
    margin:20px;
    padding:50px;
}

.box{
    background:white;
    border:1px solid #ccc;
    border-radius:8px;
}

</style>

</head>
<body>

<div class="box spacing">
    Movie Card 1
</div>

<div class="box spacing">
    Movie Card 2
</div>

<div class="box spacing">
    Movie Card 3
</div>

</body>
</html>
