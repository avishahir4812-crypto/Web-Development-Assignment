<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Notification Badge</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            margin: 0;
            height: 200vh;
            background-color: #f5f5f5;
        }

        .whatsapp-badge{
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #25D366;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: bold;
            padding: 10px;
            margin: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        .notification{
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: red;
            color: white;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
        }
    </style>

</head>
<body>

    <div class="whatsapp-badge">
        💬
        <div class="notification">5</div>
    </div>

</body>
</html>
