<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato-style restauran</title>
    <style>
        section{
            width: 320px;
            background-color: white;
            border: 2px solid #ccc;
            border-radius: 10px;
            margin: 20px;
            padding: 20px;
        }
        .name{
            background-color: #e23744;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            width: 40%;
            text-align: center;
            margin-bottom: 10px;
        }
        .Cuisine{
            background-color: #3d45de;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            width: 40%;
            text-align: center;
            margin-bottom: 10px;
        }
        .rating{
            background-color: #e23744;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            width: 40%;
            text-align: center;
            margin-bottom: 10px;
        }
        
    </style>
</head>
<body>
    <section>
        <div class="name">
        <h1>radhe krishna</h1>
        </div>
        <div class="Cuisine">
                        Cuisine: Gujarati & North Indian
        </div>
        <div class="rating">
            rating:4.9
        </div>
    </section>
</body>
</html>
