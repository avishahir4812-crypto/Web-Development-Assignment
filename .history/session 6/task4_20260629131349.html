<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMyShow Movie Grid</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f5f5f5;
            margin:30px;
        }

        .movie-grid{
            display:flex;
            justify-content:center;
            gap:20px;
            flex-wrap:wrap;
        }

        .movie-card{
            position:relative;
            width:220px;
            border:1px solid #ccc;
            border-radius:10px;
            overflow:hidden;
            background:white;
            box-shadow:0 2px 8px rgba(0,0,0,0.2);
        }

        .movie-card img{
            width:100%;
            display:block;
        }

        .movie-info{
            padding:15px;
            text-align:center;
        }

        .badge{
            position:absolute;
            top:10px;
            left:10px;
            background:red;
            color:white;
            padding:6px 12px;
            border-radius:5px;
            font-size:14px;
            font-weight:bold;
        }
    </style>

</head>
<body>

    <div class="movie-grid">

        <div class="movie-card">

            <div class="badge">NEW</div>

            <img src="/images/a11.webp" alt="Movie Poster">

            <div class="movie-info">

                <h3>Avengers: Endgame</h3>
            </div>

        </div>

        <div class="movie-card">

            <img src="/images/Oblivion.jpg" alt="Movie Poster">

            <div class="movie-info">
                <h3>Spider-Man</h3>
            </div>

        </div>

        <div class="movie-card">

            <img src="/images/d1226255f22363f6ec8ee6296eab5b5b.jpg" alt="Movie Poster">

            <div class="movie-info">
                <h3>Batman</h3>
            </div>

        </div>

    </div>

</body>
</html>
