<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamer Tag Bio Link</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#1e1e2f;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:20px;
        }

        .profile-card{
            width:380px;
            background:#2c2c3e;
            border-radius:15px;
            padding:30px;
            text-align:center;
            box-shadow:0 4px 10px rgba(0,0,0,0.3);
        }

        .profile-card img{
            width:140px;
            height:140px;
            border-radius:50%;
            object-fit:cover;
            margin-bottom:20px;
            border:4px solid #00bfff;
        }

        h1{
            color:white;
            margin-bottom:10px;
        }

        p{
            color:#cccccc;
            margin-bottom:25px;
        }

        .links{
            display:flex;
            flex-direction:column;
            gap:15px;
        }

        .links a{
            text-decoration:none;
            color:white;
            background:#5865F2;
            padding:12px;
            border-radius:8px;
            font-weight:bold;
            transition:0.3s;
        }

        .links a:nth-child(1){
            background:#9146FF;
        }

        .links a:nth-child(2){
            background:#5865F2;
        }

        .links a:nth-child(3){
            background:#171A21;
        }

        .links a:hover{
            opacity:0.85;
        }

        @media (min-width:768px){

            .profile-card{
                width:500px;
            }

            .links{
                flex-direction:row;
                justify-content:space-between;
            }

            .links a{
                flex:1;
                margin:0 5px;
            }

        }
    </style>

</head>

<body>

    <div class="profile-card">

        <img src="/images/ab.jpeg" alt="Avatar">

        <h1>yadav gamer</h1>

        <p>Professional Gamer | Streamer | Esports Enthusiast</p>

        <div class="links">

            <a href="https://www.twitch.tv" target="_blank">
                Twitch
            </a>

            <a href="https://discord.com" target="_blank">
                Discord
            </a>

            <a href="https://store.steampowered.com" target="_blank">
                Steam
            </a>

        </div>

    </div>

</body>

</html>
