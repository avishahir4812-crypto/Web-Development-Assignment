<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Links Form</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#f5f5f5;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .container{
            width:450px;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 4px 10px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
        }

        .input-box{
            position:relative;
            margin-bottom:20px;
        }

        .input-box img{
            position:absolute;
            left:12px;
            top:50%;
            transform:translateY(-50%);
            width:24px;
            height:24px;
        }

        .input-box input{
            width:100%;
            padding:12px 12px 12px 50px;
            border:1px solid #ccc;
            border-radius:6px;
            font-size:16px;
        }

        button{
            width:100%;
            padding:12px;
            background:#0077b5;
            color:white;
            border:none;
            border-radius:6px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#005f8d;
        }
    </style>

</head>

<body>

    <div class="container">

        <h2>Add Social Links</h2>

        <form>

            <div class="input-box">

                <img src="/images/instagram.png" alt="Instagram">

                <input type="url"
                       placeholder="Instagram Profile URL">

            </div>

            <div class="input-box">

                <img src="/images/linkedin.png" alt="LinkedIn">

                <input type="url"
                       placeholder="LinkedIn Profile URL">

            </div>

            <div class="input-box">

                <img src="/images/facebook.png" alt="Facebook">

                <input type="url"
                       placeholder="Facebook Profile URL">

            </div>

            <button type="submit">
                Add Links
            </button>

        </form>

    </div>

</body>

</html>
