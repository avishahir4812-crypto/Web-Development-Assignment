<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Restaurant List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <h2 class="text-center mb-4">
            Zomato Restaurant List
        </h2>

        <div class="row g-4">

            <div class="col-md-4">

                <div class="card shadow">

                    <img src="/images/thakar.jpeg"
                         class="card-img-top"
                         alt="Restaurant">

                    <div class="card-body">

                        <h4 class="card-title">
                            The Grand Thakar
                        </h4>

                        <p class="badge bg-success">
                            Rating: 4.7
                        </p>

                        <p class="badge bg-warning text-dark">
                            30% OFF
                        </p>

                        <p class="badge bg-success">
                            Open
                        </p>

                    </div>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card shadow">

                    <img src="/images/barbecu.jfif"
                         class="card-img-top"
                         alt="Restaurant">

                    <div class="card-body">

                        <h4 class="card-title">
                            Barbeque Nation
                        </h4>

                        <p class="badge bg-primary">
                            Rating: 4.5
                        </p>

                        <p class="badge bg-info text-dark">
                            Buy 1 Get 1
                        </p>

                        <p class="badge bg-danger">
                            Closed
                        </p>

                    </div>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card shadow">

                    <img src="/images/dominos.jpg"
                         class="card-img-top"
                         alt="Restaurant">

                    <div class="card-body">

                        <h4 class="card-title">
                            Domino's Pizza
                        </h4>

                        <p class="badge bg-success">
                            Rating: 4.3
                        </p>

                        <p class="badge bg-warning text-dark">
                            Free Delivery
                        </p>

                        <p class="badge bg-success">
                            Open
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
