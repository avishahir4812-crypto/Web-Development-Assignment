<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Theme Switcher</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div id="mainContainer" class="container mt-5 p-5 bg-light text-dark rounded shadow">

        <h2 class="text-center mb-4">
            Food Delivery App
        </h2>

        <p class="text-center">
            Welcome to our food delivery application. Click the button below
            to switch between Light Mode and Dark Mode.
        </p>

        <div class="text-center mt-4">
            <button class="btn btn-primary" onclick="toggleTheme()">
                Switch Theme
            </button>
        </div>

    </div>

    <script>

        function toggleTheme() {

            const container = document.getElementById("mainContainer");

            container.classList.toggle("bg-light");
            container.classList.toggle("bg-dark");

            container.classList.toggle("text-dark");
            container.classList.toggle("text-light");

        }

    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
