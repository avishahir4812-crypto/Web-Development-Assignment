<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        *{
            margin: 0%;
            padding: 0%;
            box-sizing: border-box;
        }
        body{
            background-color:bisque;
            display: flex;
            padding: auto;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .main-card{
            width: 320px;
            border-radius: 20px;
            border: solid black;
            box-shadow:color(from color srgb r g b);
            background-color: bisque;
        }
        .card img{
            height: 250px;
            width: 100%;
        }
        .card{
        background-color:rgb(181, 181, 192);
        padding:20px;
        border-radius: 20px;
        }
        .p{
            margin-bottom: 10px;
        }
        .card button{
            padding: 10px;
            width: 100%;

        }

    </style>
</head>
<body>
    <div class="main-card">
        <div class="card">
            <img src="/images/iphone15.jpg" alt="iphone17">
            <h1>iphon 17</h1>
            <p>this is the iphone17 pro and the one of the best mobile in current time in phone series. </p>
            <button>add to card</button>
        </div>
    </div>
</body>
</html>
