<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Restaurant Card</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            margin-top: 50px;
        }

        .restaurant-card{
            width: 320px;
            background-color: white;
            border: 2px solid #ccc;
            border-radius: 10px;
            margin: 20px;
            padding: 20px;
        }

        .restaurant-name{
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #ddd;
            font-size: 24px;
            font-weight: bold;
            color: #e23744;
        }

        .cuisine{
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #ddd;
            font-size: 18px;
        }

        .rating{
            padding: 10px;
            border: 1px solid #ddd;
            background-color: #28a745;
            color: white;
            text-align: center;
            font-weight: bold;
            border-radius: 5px;
        }
    </style>

</head>
<body>

    <div class="restaurant-card">

        <div class="restaurant-name">
            The Grand Thakar
        </div>

        <div class="cuisine">
            Cuisine: Gujarati & North Indian
        </div>

        <div class="rating">
             Rating: 4.6/5
        </div>

    </div>

</body>
</html>
