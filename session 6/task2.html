<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Product Tile</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color:#f5f5f5;
            display:flex;
            justify-content:center;
            margin-top:50px;
        }

        .product-card{
            width:280px;
            background:white;
            border:1px solid #ddd;
            border-radius:10px;
            padding:20px;
            text-align:center;
        }

        .product-card img{
            width:200px;
            display:block;
            margin:auto;
        }

        .product-name{
            display:block;
            font-size:22px;
            font-weight:bold;
            margin-top:15px;
        }

        .price{
            display:inline-block;
            margin-top:10px;
            padding:8px 15px;
            background:#2874f0;
            color:white;
            border-radius:5px;
            font-size:18px;
        }

    </style>

</head>
<body>

    <div class="product-card">

        <img src="/images/iphone15.jpg" alt="Wireless Headphones">

        <div class="product-name">
            Wireless Headphones
        </div>


        <div class="price hide-price">
            ₹1,999
        </div>

    </div>

</body>
</html>
