<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMyShow Movie Page</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: white;
            color: black;
            text-align: center;
            margin: 40px;
            transition: 0.3s;
        }

        .movie-card{
            width: 400px;
            margin: auto;
            padding: 20px;
            border: 2px solid #ccc;
            border-radius: 10px;
        }

        button{
            background-color: #f84464;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            font-size: 16px;
        }

        button:hover{
            background-color: #d81b60;
        }

        .dark-mode{
            background-color: #121212;
            color: white;
        }

        .dark-mode .movie-card{
            background-color: #1f1f1f;
            border-color: #555;
        }
    </style>

</head>
<body>

    <div class="movie-card">

        <h1>t shirt</h1>

        <img src="/images/123.jpg" alt="my" width="250">

        <p>
            Avengers: Endgame is an action-packed superhero movie
            featuring Earth's mightiest heroes in their final battle
            against Thanos.
        </p>

        <button onclick="toggleMode()">
            Toggle Light / Dark Mode
        </button>

    </div>

    <script>
        function toggleMode() {
            document.body.classList.toggle("dark-mode");
        }
    </script>

</body>
</html>
